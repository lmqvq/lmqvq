name: Daily contribution log

on:
  # 每天北京时间 20:15 左右运行（GitHub Actions 使用 UTC，这里是 12:15 UTC）
  schedule:
    - cron: '15 12 * * *'

  # 允许手动触发，便于首次启用后验证
  workflow_dispatch:

  # 修改工作流文件时自动验证；日志提交本身不会匹配这个路径
  push:
    branches:
      - main
    paths:
      - .github/workflows/daily-contributions.yml

permissions:
  contents: write

concurrency:
  group: daily-contribution-log
  cancel-in-progress: false

jobs:
  contribute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY_OWNER: ${{ github.repository_owner }}
      REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
      CONTRIBUTION_EMAIL: ${{ vars.CONTRIBUTION_EMAIL || secrets.CONTRIBUTION_EMAIL }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Create 4-10 daily commits
        shell: bash
        run: |
          set -euo pipefail

          # If CONTRIBUTION_EMAIL is set as an Actions variable or secret,
          # use it. Otherwise use GitHub's ID-based noreply address for the repository owner.
          if [[ -n "${CONTRIBUTION_EMAIL:-}" ]]; then
            git_email="$CONTRIBUTION_EMAIL"
          else
            git_email="${REPOSITORY_OWNER_ID}+${REPOSITORY_OWNER}@users.noreply.github.com"
          fi

          git config user.name "$REPOSITORY_OWNER"
          git config user.email "$git_email"

          log_file='.github/daily-contributions.log'
          mkdir -p "$(dirname "$log_file")"

          today="$(date -u +'%Y-%m-%d')"
          existing_count=0
          if [[ -f "$log_file" ]]; then
            existing_count="$(awk -v day="$today" 'substr($1, 1, 10) == day { count++ } END { print count + 0 }' "$log_file")"
          fi

          target_count=$((4 + RANDOM % 7))
          if (( existing_count >= target_count )); then
            echo "Already have ${existing_count} contribution commits for ${today}; nothing to do."
            exit 0
          fi

          for ((i=existing_count + 1; i<=target_count; i++)); do
            timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf '%s | scheduled contribution %d/%d\n' "$timestamp" "$i" "$target_count" >> "$log_file"
            git add -f "$log_file"
            git commit -m "chore: daily contribution ${i}/${target_count}"
          done

          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "Created $((target_count - existing_count)) commits on ${DEFAULT_BRANCH}; total for ${today}: ${target_count}."




